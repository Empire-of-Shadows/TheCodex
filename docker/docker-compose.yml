services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - HEALTHCHECK_DEBUG=true  # Enable debug mode
    container_name: codex
    image: codex
    ports:
      - "50002:50002"  # Health check HTTP endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:50002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /mnt/data/bots/profile_cards:/app/data
      - ${HOST_LOG_DIR:-./logs}/Codex:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - imperial_network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file:
      - .env
    container_name: codex-dashboard
    image: codex-dashboard
    ports:
      - "54006:54006"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:54006/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${HOST_LOG_DIR:-./logs}/CodexDashboard:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - imperial_network

networks:
  imperial_network:
    external: true