name: TheCodex
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GIT_REF=${GIT_REF:-Revamp}
    env_file:
      - .env
    environment:
      - HEALTHCHECK_DEBUG=true  # Enable debug mode
    container_name: TheCodex
    image: the-codex
    ports:
      - "50002:50002"  # Health check HTTP endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:50002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /mnt/data/bots/profile_cards:/app/data
      - ${HOST_LOG_DIR:-./logs}/Codex:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - obsidian_grid

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        - GIT_REF=${GIT_REF:-Revamp}
    env_file:
      - .env
    container_name: TheCodex-Dashboard
    image: the-codex-dashboard
    ports:
      - "54002:54002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:54002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${HOST_LOG_DIR:-./logs}/CodexDashboard:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - obsidian_grid

networks:
  obsidian_grid:
    external: true