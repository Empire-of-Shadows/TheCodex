services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      ssh:
        - default=${DEPLOY_KEY_PATH:-~/.ssh/deploy_keys/codex_deploy_key}
    env_file:
      - .env
    environment:
      - HEALTHCHECK_DEBUG=true  # Enable debug mode
    container_name: codex
    image: codex
    ports:
      - "50001:50001"  # Health check HTTP endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:50001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /mnt/data/bots/profile_cards:/app/data
      - ${HOST_LOG_DIR:-./logs}/Codex:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - imperial_network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      ssh:
        - default=${DEPLOY_KEY_PATH:-~/.ssh/deploy_keys/codex_deploy_key}
    env_file:
      - .env
    container_name: codex-dashboard
    image: codex-dashboard
    ports:
      - "8048:8048"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8048/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ${HOST_LOG_DIR:-./logs}/CodexDashboard:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - imperial_network

networks:
  imperial_network:
    external: true