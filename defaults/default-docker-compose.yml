services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - HEALTHCHECK_DEBUG=true  # Enable debug mode
    container_name: codex
    image: codex
    ports:
      - "50001:50001"  # Health check HTTP endpoint
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:50001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /mnt/data/bots/profile_cards:/app/data
      - ${HOST_LOG_DIR:-./logs}/Codex:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
